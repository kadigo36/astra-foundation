name: Apps Script static validation

on:
  pull_request:
    paths:
      - "google-apps-script/**"
      - ".github/workflows/apps-script-check.yml"
  push:
    branches:
      - "feature/zero-cost-architecture-v0-8"
      - "feature/multi-google-accounts-v0-9"
      - "fix/apps-script-persistence-audit-2026-11-18"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Apps Script JavaScript syntax
        run: |
          for script in google-apps-script/*.gs google-apps-script/live-school/*.gs google-apps-script/candidates/*.gs; do
            node --check --input-type=commonjs < "$script"
          done
      - name: Validate Apps Script manifest JSON
        run: python -m json.tool google-apps-script/appsscript.json > /dev/null
      - name: Test persistence and crash recovery with isolated mocks
        run: node --test google-apps-script/tests/*.test.cjs

